<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>迷你高尔夫 第一关 V20.6 · Deep Cup Capture Fix</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#123b22;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;touch-action:none}
canvas{display:block;width:100vw;height:100dvh;touch-action:none}
#hud{position:fixed;top:max(14px,env(safe-area-inset-top));left:0;right:0;text-align:center;color:#fff;text-shadow:0 2px 4px #0008;pointer-events:none}
#hud b{font-size:19px}.sub{font-size:12px;margin-top:4px}
#msg{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;color:#fff;font-size:30px;font-weight:800;text-shadow:0 3px 8px #000;pointer-events:none}
#reset{position:fixed;right:14px;bottom:max(92px,calc(env(safe-area-inset-bottom) + 78px));padding:9px 14px;border:0;border-radius:18px;background:#fff;color:#173e25;font-weight:700}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b>第一关 · PAR 3　杆数：<span id="n">0</span></b><div class="sub">按住白球向后拖，松手击球</div></div>
<div id="msg"></div><button id="reset">重新开始</button>
<script>
(()=>{
const c=document.getElementById('c'),g=c.getContext('2d'),N=document.getElementById('n'),M=document.getElementById('msg');
let W,H,D=1,strokes=0,won=false,drag=false,px=0,py=0;
let showFlag=true,fullStraightShot=false,crossedCupFast=false,topWallAfterFast=false;
let cupMode='free', cupTurn=1, cupEntrySpeed=0;
let cupEscapeLock=false, cupWasInside=false, cupPeakEntry=0, cupEntryFalling=0;
let fastCupTransit=false, fastCupCooldown=false;
let ball={x:0,y:0,r:10,vx:0,vy:0,z:0,vz:0,alpha:1,scale:1},hole={x:0,y:0,r:25.3};
let AC=null,master=null,rollSrc=null,rollGain=null,rollFilter=null,lastRimSound=0;
const MAX_PULL=175, POWER=.092, FRICTION=.987, STOP=.025;
const CUP_ENTRY_DRAG=.982;            // shallow contact: modest loss
const CUP_ORBIT_DRAG=.955;            // while riding the lip: strong loss
const CUP_PULL=.010;                  // only weak inward gravity, never snap-to-center
const CUP_TURN=.105;                  // bends velocity along the circular rim
const FAST_THROUGH=8.7;               // central high-speed shot must pass through
const FAST_LIP=6.4;                   // off-center high-speed shots can lip around and escape
const DROP_SPEED=4.65;                // normal low-speed capture
const DEEP_DROP_SPEED=6.0;            // deep slow/moderate capture
const ENTRY_DEPTH_RATIO=.78;
const BOTTOM_SAFE=88;               // Safari clearance, but preserve a longer lane
const TOP_SAFE=72;

function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath()}
function audioInit(){
 if(AC)return; AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain();master.gain.value=.72;master.connect(AC.destination);
 const n=AC.sampleRate*2,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
 rollSrc=AC.createBufferSource();rollSrc.buffer=b;rollSrc.loop=true;rollFilter=AC.createBiquadFilter();rollFilter.type='lowpass';rollFilter.frequency.value=520;rollFilter.Q.value=.35;rollGain=AC.createGain();rollGain.gain.value=0;rollSrc.connect(rollFilter).connect(rollGain).connect(master);rollSrc.start();
}
function tone(freq,dur,vol=.1,type='sine',endFreq=null){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);if(endFreq)o.frequency.exponentialRampToValueAtTime(endFreq,t+dur);gn.gain.setValueAtTime(Math.max(.0001,vol),t);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(gn).connect(master);o.start(t);o.stop(t+dur+.02)}
function noiseHit(dur=.04,vol=.08,freq=1600){if(!AC)return;const n=Math.max(1,Math.floor(AC.sampleRate*dur)),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const src=AC.createBufferSource(),f=AC.createBiquadFilter(),gn=AC.createGain();src.buffer=b;f.type='bandpass';f.frequency.value=freq;f.Q.value=.8;gn.gain.value=vol;src.connect(f).connect(gn).connect(master);src.start()}
function sfxStrike(v){audioInit();const q=Math.min(1,v/16);/* putter face -> golf ball: compact click, louder/brighter with pull */tone(1180+420*q,.014,.040+.095*q,'triangle',760+180*q);tone(330+80*q,.022,.018+.035*q,'sine',250);noiseHit(.009,.010+.025*q,2800+900*q)}
function sfxWall(v){audioInit();const q=Math.min(1,v/10);tone(390+220*q,.045+.018*q,.07+.11*q,'triangle',250+120*q);noiseHit(.028,.035+.05*q,1800+700*q)}
function sfxRim(v){audioInit();const now=performance.now();const q=Math.min(1,v/7);const gap=105-45*q;if(now-lastRimSound<gap)return;lastRimSound=now;/* repeated light cup-lip ticks while the ball rides the rim */tone(1420+260*q,.013,.020+.032*q,'triangle',930);noiseHit(.008,.009+.014*q,3600)}
function sfxCup(v){audioInit();const q=Math.min(1,v/6);/* recognizable golf cup sequence: lip/liner click -> drop -> short cup-bottom resonance */tone(1260+180*q,.015,.050+.030*q,'triangle',820);noiseHit(.010,.018+.010*q,3300);setTimeout(()=>{tone(410+55*q,.030,.060+.030*q,'triangle',255);noiseHit(.018,.020+.010*q,1050)},38);setTimeout(()=>tone(235,.075,.055+.025*q,'sine',145),58);setTimeout(()=>tone(520,.018,.020+.012*q,'triangle',330),82)}
function updateRoll(){if(!AC||!rollGain)return;const s=speed(),active=!won&&cupMode!=='drop'&&s>.55;/* intentionally subtle: turf roll is ambience, not the main effect */const target=active?Math.min(.012,.0012+Math.max(0,s-.55)*.00085):0;rollGain.gain.setTargetAtTime(target,AC.currentTime,.055);rollFilter.frequency.setTargetAtTime(260+Math.min(420,s*28),AC.currentTime,.07)}
function speed(){return Math.hypot(ball.vx,ball.vy)}
function reset(full=true){
 ball.r=Math.max(9,Math.min(12,W*.024)); hole.r=ball.r*2.53; // fixed standard: cup diameter ≈ 2.53 × ball diameter
 hole.x=W/2;
 // fixed design rule: cup center about 3 cup diameters below playable top edge
 const playableTop=TOP_SAFE;
 hole.y=playableTop + 6*hole.r; // hole center = 3 cup diameters below lane top
 // ball is deliberately lifted above Safari toolbar / gesture zone
 ball.x=W/2;
 ball.y=H-BOTTOM_SAFE-1.5*ball.r;
 ball.vx=ball.vy=0;drag=false;won=false;
 showFlag=true;fullStraightShot=false;crossedCupFast=false;topWallAfterFast=false;
 cupMode='free';cupEntrySpeed=0;cupEscapeLock=false;cupWasInside=false;cupPeakEntry=0;cupEntryFalling=0;fastCupTransit=false;fastCupCooldown=false;ball.z=0;ball.vz=0;ball.alpha=1;ball.scale=1;
 M.textContent='';
 if(full){strokes=0;N.textContent='0'}
}
function resize(){
 D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);reset(false)
}
function pos(e){let t=e.touches?e.touches[0]:e;return{x:t.clientX,y:t.clientY}}
function down(e){audioInit();if(AC&&AC.state==='suspended')AC.resume();if(won||speed()>.08)return;let q=pos(e);if(Math.hypot(q.x-ball.x,q.y-ball.y)<ball.r*3.0){drag=true;showFlag=false;px=q.x;py=q.y;e.preventDefault()}}
function move(e){if(!drag)return;let q=pos(e);px=q.x;py=q.y;e.preventDefault()}
function up(e){
 if(!drag)return;drag=false;
 let dx=ball.x-px,dy=ball.y-py,d=Math.hypot(dx,dy);if(d<5)return;
 const rawD=d;
 if(d>MAX_PULL){dx*=MAX_PULL/d;dy*=MAX_PULL/d;d=MAX_PULL}
 const aimX=dx/(Math.hypot(dx,dy)||1);
 fullStraightShot=(rawD>=MAX_PULL*.90 && Math.abs(aimX)<.085);
 crossedCupFast=false;topWallAfterFast=false;cupEscapeLock=false;cupWasInside=false;cupPeakEntry=0;cupEntryFalling=0;fastCupTransit=false;fastCupCooldown=false;
 ball.vx=dx*POWER;ball.vy=dy*POWER;sfxStrike(Math.hypot(ball.vx,ball.vy));strokes++;N.textContent=strokes;e.preventDefault()
}
function sink(){
 if(won)return;
 won=true;ball.vx=ball.vy=0;ball.x=hole.x;ball.y=hole.y;

 let result='';
 if(strokes===1){
   result='1 杆　EAGLE + 幸运 1<br><span style="font-size:16px">恭喜！一杆进洞</span>';
 }else if(strokes===2){
   result='2 杆　BIRDIE<br><span style="font-size:16px">恭喜！抓小鸟</span>';
 }else if(strokes===3){
   result='3 杆　PAR';
 }else if(strokes===4){
   result='4 杆　BOGEY';
 }else if(strokes===5){
   result='5 杆　DOUBLE BOGEY';
 }else if(strokes===6){
   result='6 杆　DOUBLE PAR';
 }else{
   result=strokes+' 杆';
 }
 M.innerHTML=result;
}


function beginDrop(){
  if(cupMode==='drop')return;
  sfxCup(speed());
  cupMode='drop';
  ball.z=0;ball.vz=.55;
}
function dropPhysics(){
  // Horizontal momentum survives briefly while gravity rapidly takes over vertically.
  ball.x+=ball.vx;ball.y+=ball.vy;
  ball.vx*=.90;ball.vy*=.90;
  ball.vz+=.34;ball.z+=ball.vz;
  const t=Math.min(1,ball.z/(ball.r*2.7));
  ball.scale=1-.38*t;
  ball.alpha=1-.72*t;
  if(t>=1){sink();return true}
  return false;
}
function cupPhysics(){
  if(cupMode==='drop')return dropPhysics();

  const rx=ball.x-hole.x,ry=ball.y-hole.y;
  const d=Math.hypot(rx,ry)||.0001;
  const s=speed();
  const contact=hole.r+ball.r;
  const overlap=contact-d;

  // V20.5: after any high-speed cup entry, capture is forbidden for the ENTIRE
  // contact episode. It cannot become a drop merely because cup contact slows it.
  // A new capture decision is allowed only after the ball has fully cleared the cup.
  if(fastCupCooldown){
    if(d>contact+ball.r*2.05){
      fastCupCooldown=false;fastCupTransit=false;cupEscapeLock=false;
      cupWasInside=false;cupPeakEntry=0;cupEntryFalling=0;cupMode='free';
    }else{
      cupMode='free';
      return false;
    }
  }

  if(cupEscapeLock){
    if(d>contact+ball.r*2.05){
      cupEscapeLock=false;cupWasInside=false;cupPeakEntry=0;cupEntryFalling=0;cupMode='free';
    }else{
      cupMode='free';
      return false;
    }
  }
  if(overlap<=0){
    // A fast transit is not considered finished at the geometric edge. Keep a
    // cooldown until the whole ball has clearly escaped the cup neighborhood.
    if(fastCupTransit){fastCupTransit=false;fastCupCooldown=true;cupMode='free';return false}
    cupMode='free';cupWasInside=false;cupPeakEntry=0;cupEntryFalling=0;return false
  }
  if(s<.001)return false;

  const entry=Math.max(0,Math.min(1,overlap/(2*ball.r)));
  const ux=rx/d,uy=ry/d;
  const radial=ball.vx*ux+ball.vy*uy;
  const tangential=-ball.vx*uy+ball.vy*ux;
  const lineOffset=Math.abs(rx*ball.vy-ry*ball.vx)/Math.max(s,.001);
  const central=lineOffset<ball.r*.27;

  // Establish the irreversible high-speed state on FIRST meaningful overlap.
  // 5.35 matches the existing upper boundary of normal capture behavior.
  if(!fastCupTransit && entry>.08 && s>5.35)fastCupTransit=true;

  if(entry>.28)cupWasInside=true;
  if(entry>cupPeakEntry+.008){cupPeakEntry=entry;cupEntryFalling=0}
  else if(cupPeakEntry>.42 && entry<cupPeakEntry-.035){cupEntryFalling++}
  if(entry>.14 && (Math.abs(radial)>.16 || Math.abs(tangential)>.45))sfxRim(s);

  // Centered high-speed transit: cross the open cup with visible energy loss,
  // but never become a drop during this transit, even if speed later falls.
  if(fastCupTransit && central){
    if(fullStraightShot && !topWallAfterFast)crossedCupFast=true;
    const loss=.989-.024*entry;
    ball.vx*=loss;ball.vy*=loss;
    return false;
  }

  // Continuous lip contact for offset entries. High-speed offset balls may be
  // deflected by the lip, but fastCupTransit still forbids capture this episode.
  const support=Math.max(0,1-entry);
  let nr=radial;
  let nt=tangential;
  if(nr>0) nr*=Math.max(.18,.96-.70*entry);
  else nr*=Math.max(.55,.995-.20*entry);
  nt*=Math.max(.86,.998-.055*entry);
  const inward=.010+.075*entry*entry;
  nr-=inward*(.55+Math.min(1,3/Math.max(s,.2))*.45);
  ball.vx=nr*ux-nt*uy;
  ball.vy=nr*uy+nt*ux;

  const v2=speed();
  const outwardNow=(ball.vx*ux+ball.vy*uy);

  // Once a high-speed offset ball starts leaving, freeze out all cup capture
  // until it has completely cleared the neighborhood.
  if(fastCupTransit && cupWasInside && cupPeakEntry>.38 && cupEntryFalling>=1 && outwardNow>.02){
    fastCupTransit=false;fastCupCooldown=true;cupMode='free';
    return false;
  }

  // V20.6: deep + slow + not escaping means the cup has truly retained the ball.
  // This prevents the V20.5 hover state without re-enabling snap-back on lip-outs.
  const deepSettled = entry>=.84 && v2<=2.15 && outwardNow<=.015 && cupEntryFalling===0;
  if(fastCupTransit && deepSettled){
    fastCupTransit=false;fastCupCooldown=false;cupEscapeLock=false;
    beginDrop();return dropPhysics();
  }

  // Genuine high-speed transit remains protected from ordinary capture.
  if(fastCupTransit)return false;

  // Normal low/moderate-speed capture logic below is intentionally unchanged.
  const clearlyEscaping = cupWasInside && cupPeakEntry>.48 && cupEntryFalling>=1 && outwardNow>.035;
  const energeticEscape = clearlyEscaping && (v2>2.55 || Math.abs(nt)>2.15);
  if(energeticEscape){
    cupEscapeLock=true;cupMode='free';
    return false;
  }

  const offsetRatio=Math.min(1,lineOffset/(hole.r||1));
  const captureDepth=.60+.18*offsetRatio;
  const captureSpeed=4.7-2.2*offsetRatio;
  if(cupEntryFalling===0 && entry>=captureDepth && v2<=captureSpeed){beginDrop();return dropPhysics()}
  if(cupEntryFalling===0 && entry>=.88 && v2<=5.7){beginDrop();return dropPhysics()}

  return false;
}
function physics(){
 if(won)return;
 if(cupMode==='orbit'){
   if(orbitPhysics())return;
 }else if(speed()>0){
   ball.x+=ball.vx;ball.y+=ball.vy;
   // On the protected full-power rebound, stop above the cup before any cup interaction.
   if(topWallAfterFast && ball.vy>0){
     const safeY=hole.y-hole.r-ball.r*2.8;
     if(ball.y>=safeY){
       ball.y=safeY;ball.vx=0;ball.vy=0;cupMode='free';
       fullStraightShot=false;crossedCupFast=false;topWallAfterFast=false;
       return;
     }
   }
   if(cupPhysics())return;
   ball.vx*=FRICTION;ball.vy*=FRICTION;
   if(Math.abs(ball.vx)<STOP)ball.vx=0;if(Math.abs(ball.vy)<STOP)ball.vy=0;
 }
 const T=TOP_SAFE,B=H-10;
 const laneH=B-T;
 const laneW=Math.min(W*.82,laneH/2.51);
 const L=(W-laneW)/2,R=(W+laneW)/2;
 if(ball.x-ball.r<L){const iv=speed();ball.x=L+ball.r;ball.vx=Math.abs(ball.vx)*.78;sfxWall(iv)}
 if(ball.x+ball.r>R){const iv=speed();ball.x=R-ball.r;ball.vx=-Math.abs(ball.vx)*.78;sfxWall(iv)}
 if(ball.y-ball.r<T){
 const iv=speed();ball.y=T+ball.r;sfxWall(iv);
 if(fullStraightShot && crossedCupFast){
   topWallAfterFast=true;
   // First-hole full-power protection: visible rebound, with heavy energy loss.
   ball.vy=Math.abs(ball.vy)*.24;
   ball.vx*=.35;
 }else{
   ball.vy=Math.abs(ball.vy)*.78;
 }
}
 if(ball.y+ball.r>B){const iv=speed();ball.y=B-ball.r;ball.vy=-Math.abs(ball.vy)*.78;sfxWall(iv)}
 // IMPORTANT: this check happens BEFORE cupPhysics.
 // A maximum-power straight shot must never be captured on the rebound.
 if(topWallAfterFast && ball.vy>0){
   const safeY=hole.y-hole.r-ball.r*2.8;
   if(ball.y>=safeY){
     ball.y=safeY;
     ball.vx=0;ball.vy=0;
     cupMode='free';
     fullStraightShot=false;crossedCupFast=false;topWallAfterFast=false;
     return;
   }
 }
 if(cupMode!=='drop')cupPhysics();
}
function draw(){
 g.clearRect(0,0,W,H);g.fillStyle='#078d43';g.fillRect(0,0,W,H);
 const B=H-10;
 const laneH=B-TOP_SAFE;
 const laneW=Math.min(W*.82,laneH/2.51);
 const L=(W-laneW)/2;
 g.fillStyle='#42ae61';rr(L,TOP_SAFE,W-2*L,B-TOP_SAFE,18);g.fill();
 g.fillStyle='rgba(255,255,255,.025)';g.fillRect(W*.37,TOP_SAFE,W*.26,B-TOP_SAFE);
 // cup
 g.fillStyle='#111';g.beginPath();g.arc(hole.x,hole.y,hole.r,0,Math.PI*2);g.fill();
 g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=1.5;g.stroke();
 // flag is visual only; it disappears as soon as the player first touches the ball.
 if(showFlag){
   g.strokeStyle='#eee';g.lineWidth=2;g.beginPath();g.moveTo(hole.x,hole.y);g.lineTo(hole.x,hole.y-62);g.stroke();
   g.fillStyle='#e32626';g.beginPath();g.moveTo(hole.x,hole.y-62);g.lineTo(hole.x+34,hole.y-51);g.lineTo(hole.x,hole.y-40);g.closePath();g.fill();
 }
 // aim
 if(drag){
   let dx=ball.x-px,dy=ball.y-py,d=Math.hypot(dx,dy);if(d>MAX_PULL){dx*=MAX_PULL/d;dy*=MAX_PULL/d}
   g.setLineDash([7,8]);g.strokeStyle='#fff9';g.lineWidth=2;g.beginPath();g.moveTo(ball.x,ball.y);g.lineTo(ball.x+dx*1.5,ball.y+dy*1.5);g.stroke();g.setLineDash([]);
   g.strokeStyle='#fff5';g.beginPath();g.moveTo(ball.x,ball.y);g.lineTo(px,py);g.stroke();
 }
 g.save();g.globalAlpha=ball.alpha;g.fillStyle='#fff';g.beginPath();g.arc(ball.x,ball.y,ball.r*ball.scale,0,Math.PI*2);g.fill();g.strokeStyle='#bbb';g.stroke();g.restore();
}
c.addEventListener('touchstart',down,{passive:false});c.addEventListener('touchmove',move,{passive:false});c.addEventListener('touchend',up,{passive:false});
c.addEventListener('mousedown',down);addEventListener('mousemove',move);addEventListener('mouseup',up);
document.getElementById('reset').onclick=()=>reset(true);addEventListener('resize',resize);
function loop(){physics();updateRoll();draw();requestAnimationFrame(loop)}resize();loop();
})();
</script></body></html>
