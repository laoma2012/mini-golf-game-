<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>迷你高尔夫 第一关 v10</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#123b22;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;touch-action:none}
canvas{display:block;width:100vw;height:100dvh;touch-action:none}
#hud{position:fixed;top:max(14px,env(safe-area-inset-top));left:0;right:0;text-align:center;color:#fff;text-shadow:0 2px 4px #0008;pointer-events:none}
#hud b{font-size:19px}.sub{font-size:12px;margin-top:4px}
#msg{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;color:#fff;font-size:30px;font-weight:800;text-shadow:0 3px 8px #000;pointer-events:none}
#reset{position:fixed;right:14px;bottom:max(92px,calc(env(safe-area-inset-bottom) + 78px));padding:9px 14px;border:0;border-radius:18px;background:#fff;color:#173e25;font-weight:700}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b>第一关 · PAR 3　杆数：<span id="n">0</span></b><div class="sub">按住白球向后拖，松手击球</div></div>
<div id="msg"></div><button id="reset">重新开始</button>
<script>
(()=>{
const c=document.getElementById('c'),g=c.getContext('2d'),N=document.getElementById('n'),M=document.getElementById('msg');
let W,H,D=1,strokes=0,won=false,drag=false,px=0,py=0;
let showFlag=true,fullStraightShot=false,crossedCupFast=false,topWallAfterFast=false;
let cupMode='free', cupTurn=1, cupEntrySpeed=0;
let ball={x:0,y:0,r:10,vx:0,vy:0},hole={x:0,y:0,r:25.3};
const MAX_PULL=175, POWER=.092, FRICTION=.987, STOP=.025;
const CUP_ENTRY_DRAG=.982;            // shallow contact: modest loss
const CUP_ORBIT_DRAG=.955;            // while riding the lip: strong loss
const CUP_PULL=.010;                  // only weak inward gravity, never snap-to-center
const CUP_TURN=.105;                  // bends velocity along the circular rim
const FAST_THROUGH=8.7;               // central high-speed shot must pass through
const FAST_LIP=6.4;                   // off-center high-speed shots can lip around and escape
const DROP_SPEED=4.65;                // normal low-speed capture
const DEEP_DROP_SPEED=6.0;            // deep slow/moderate capture
const ENTRY_DEPTH_RATIO=.78;
const BOTTOM_SAFE=88;               // Safari clearance, but preserve a longer lane
const TOP_SAFE=72;

function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath()}
function speed(){return Math.hypot(ball.vx,ball.vy)}
function reset(full=true){
 ball.r=Math.max(9,Math.min(12,W*.024)); hole.r=ball.r*2.53; // fixed standard: cup diameter ≈ 2.53 × ball diameter
 hole.x=W/2;
 // fixed design rule: cup center about 3 cup diameters below playable top edge
 const playableTop=TOP_SAFE;
 hole.y=playableTop + 6*hole.r; // hole center = 3 cup diameters below lane top
 // ball is deliberately lifted above Safari toolbar / gesture zone
 ball.x=W/2;
 ball.y=H-BOTTOM_SAFE-1.5*ball.r;
 ball.vx=ball.vy=0;drag=false;won=false;
 showFlag=true;fullStraightShot=false;crossedCupFast=false;topWallAfterFast=false;cupMode='free';cupEntrySpeed=0;
 M.textContent='';
 if(full){strokes=0;N.textContent='0'}
}
function resize(){
 D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);reset(false)
}
function pos(e){let t=e.touches?e.touches[0]:e;return{x:t.clientX,y:t.clientY}}
function down(e){if(won||speed()>.08)return;let q=pos(e);if(Math.hypot(q.x-ball.x,q.y-ball.y)<ball.r*3.0){drag=true;showFlag=false;px=q.x;py=q.y;e.preventDefault()}}
function move(e){if(!drag)return;let q=pos(e);px=q.x;py=q.y;e.preventDefault()}
function up(e){
 if(!drag)return;drag=false;
 let dx=ball.x-px,dy=ball.y-py,d=Math.hypot(dx,dy);if(d<5)return;
 const rawD=d;
 if(d>MAX_PULL){dx*=MAX_PULL/d;dy*=MAX_PULL/d;d=MAX_PULL}
 const aimX=dx/(Math.hypot(dx,dy)||1);
 fullStraightShot=(rawD>=MAX_PULL*.94 && Math.abs(aimX)<.055);
 crossedCupFast=false;topWallAfterFast=false;
 ball.vx=dx*POWER;ball.vy=dy*POWER;strokes++;N.textContent=strokes;e.preventDefault()
}
function sink(){
 if(won)return;
 won=true;ball.vx=ball.vy=0;ball.x=hole.x;ball.y=hole.y;

 let result='';
 if(strokes===1){
   result='1 杆　EAGLE + 幸运 1<br><span style="font-size:16px">恭喜！一杆进洞</span>';
 }else if(strokes===2){
   result='2 杆　BIRDIE<br><span style="font-size:16px">恭喜！抓小鸟</span>';
 }else if(strokes===3){
   result='3 杆　PAR';
 }else if(strokes===4){
   result='4 杆　BOGEY';
 }else if(strokes===5){
   result='5 杆　DOUBLE BOGEY';
 }else if(strokes===6){
   result='6 杆　DOUBLE PAR';
 }else{
   result=strokes+' 杆';
 }
 M.innerHTML=result;
}
function cupPhysics(){
 const rx=ball.x-hole.x, ry=ball.y-hole.y;
 const d=Math.hypot(rx,ry);
 const s=speed();
 const opening=hole.r;

 // Outside the actual opening: the cup exerts no force at all.
 // This deliberately removes the old "solid center / invisible bumper" feeling.
 if(d>=opening){
   if(cupMode==='rim' && d>opening+ball.r*.45) cupMode='free';
   return false;
 }
 if(s<.001)return false;

 // Maximum-power straight shot remains an overspeed through-putt.
 const cross=rx*ball.vy-ry*ball.vx;
 const lineOffset=Math.abs(cross)/Math.max(s,.001);
 const central=lineOffset<ball.r*.34;
 if(fullStraightShot && central && s>5.6 && !topWallAfterFast){
   crossedCupFast=true;
   // Smooth loss across the OPEN cup, never a bounce.
   ball.vx*=.986; ball.vy*=.986;
   return false;
 }
 if(central && s>8.0){
   ball.vx*=.989; ball.vy*=.989;
   return false;
 }

 // Enter rim state once the ball center has genuinely crossed the cup edge.
 if(cupMode!=='rim'){
   cupMode='rim';
   cupEntrySpeed=s;
   cupTurn=Math.sign(cross);
   if(cupTurn===0){
     // Perfectly central moderate/slow entry has no artificial sideways kick.
     cupTurn=0;
   }
 }

 const depth=Math.max(0,Math.min(1,(opening-d)/opening));

 // Perfectly central slow/moderate ball: continue straight into the empty opening.
 // Gravity/energy loss makes it drop only after it is well inside.
 if(cupTurn===0){
   const smooth=.992-.018*depth;
   ball.vx*=smooth; ball.vy*=smooth;
   if(depth>.52 && speed()<5.15){sink();return true}
   return false;
 }

 // Off-center entry: preserve angular momentum and bend along the INNER RIM.
 // Tangent direction follows the incoming angular momentum. There is NO outward normal impulse.
 const ux=rx/(d||1), uy=ry/(d||1);          // center -> ball
 const tx=cupTurn*(-uy), ty=cupTurn*ux;     // rim tangent
 const inwardX=-ux, inwardY=-uy;            // only inward, never outward

 const v=speed();
 let vx=ball.vx, vy=ball.vy;

 // Continuous curvature, not a sudden redirection.
 // The deeper the unsupported ball is, the more its path follows the rim.
 const tangentBlend=.018+.055*depth;
 vx=vx*(1-tangentBlend)+(tx*v)*tangentBlend;
 vy=vy*(1-tangentBlend)+(ty*v)*tangentBlend;

 // Small inward "fall" makes the orbit radius contract gradually.
 const fall=.010+.020*depth;
 vx+=inwardX*fall;
 vy+=inwardY*fall;

 // Energy loss is gradual per frame, avoiding the visible sudden brake at first contact.
 const drag=.996-.010*depth;
 ball.vx=vx*drag;
 ball.vy=vy*drag;

 const v2=speed();
 const radialIn=ball.vx*inwardX+ball.vy*inwardY;
 const tang=Math.abs(ball.vx*tx+ball.vy*ty);

 // Sink only when the ball has travelled well inside and lost enough energy.
 // No center point collision exists anywhere in this model.
 if(depth>.62 && v2<4.15 && tang<2.65 && radialIn>=-.4){
   sink();return true;
 }
 if(depth>.78 && v2<4.8){
   sink();return true;
 }
 if(v2<.14 && depth>.42){
   sink();return true;
 }
 return false;
}
function physics(){
 if(won)return;
 if(speed()>0){
   ball.x+=ball.vx;ball.y+=ball.vy;
   if(cupPhysics())return;
   ball.vx*=FRICTION;ball.vy*=FRICTION;
   if(Math.abs(ball.vx)<STOP)ball.vx=0;if(Math.abs(ball.vy)<STOP)ball.vy=0;
 }
 const T=TOP_SAFE,B=H-10;
 const laneH=B-T;
 const laneW=Math.min(W*.82,laneH/2.51);
 const L=(W-laneW)/2,R=(W+laneW)/2;
 if(ball.x-ball.r<L){ball.x=L+ball.r;ball.vx=Math.abs(ball.vx)*.78}
 if(ball.x+ball.r>R){ball.x=R-ball.r;ball.vx=-Math.abs(ball.vx)*.78}
 if(ball.y-ball.r<T){
 ball.y=T+ball.r;
 if(fullStraightShot && crossedCupFast){
   topWallAfterFast=true;
   // Tuned first-hole protection: return stroke dies above the cup.
   ball.vy=Math.abs(ball.vy)*.31;
   ball.vx*=.45;
 }else{
   ball.vy=Math.abs(ball.vy)*.78;
 }
}
 if(ball.y+ball.r>B){ball.y=B-ball.r;ball.vy=-Math.abs(ball.vy)*.78}
 if(topWallAfterFast && ball.vy>0 && ball.y>=hole.y-hole.r-ball.r*2.2){
   ball.y=hole.y-hole.r-ball.r*2.2;
   ball.vx=0;ball.vy=0;
   fullStraightShot=false;crossedCupFast=false;topWallAfterFast=false;
 }
 cupPhysics();
}
function draw(){
 g.clearRect(0,0,W,H);g.fillStyle='#078d43';g.fillRect(0,0,W,H);
 const B=H-10;
 const laneH=B-TOP_SAFE;
 const laneW=Math.min(W*.82,laneH/2.51);
 const L=(W-laneW)/2;
 g.fillStyle='#42ae61';rr(L,TOP_SAFE,W-2*L,B-TOP_SAFE,18);g.fill();
 g.fillStyle='rgba(255,255,255,.025)';g.fillRect(W*.37,TOP_SAFE,W*.26,B-TOP_SAFE);
 // cup
 g.fillStyle='#111';g.beginPath();g.arc(hole.x,hole.y,hole.r,0,Math.PI*2);g.fill();
 g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=1.5;g.stroke();
 // flag is visual only; it disappears as soon as the player first touches the ball.
 if(showFlag){
   g.strokeStyle='#eee';g.lineWidth=2;g.beginPath();g.moveTo(hole.x,hole.y);g.lineTo(hole.x,hole.y-62);g.stroke();
   g.fillStyle='#e32626';g.beginPath();g.moveTo(hole.x,hole.y-62);g.lineTo(hole.x+34,hole.y-51);g.lineTo(hole.x,hole.y-40);g.closePath();g.fill();
 }
 // aim
 if(drag){
   let dx=ball.x-px,dy=ball.y-py,d=Math.hypot(dx,dy);if(d>MAX_PULL){dx*=MAX_PULL/d;dy*=MAX_PULL/d}
   g.setLineDash([7,8]);g.strokeStyle='#fff9';g.lineWidth=2;g.beginPath();g.moveTo(ball.x,ball.y);g.lineTo(ball.x+dx*1.5,ball.y+dy*1.5);g.stroke();g.setLineDash([]);
   g.strokeStyle='#fff5';g.beginPath();g.moveTo(ball.x,ball.y);g.lineTo(px,py);g.stroke();
 }
 g.fillStyle='#fff';g.beginPath();g.arc(ball.x,ball.y,ball.r,0,Math.PI*2);g.fill();g.strokeStyle='#bbb';g.stroke();
}
c.addEventListener('touchstart',down,{passive:false});c.addEventListener('touchmove',move,{passive:false});c.addEventListener('touchend',up,{passive:false});
c.addEventListener('mousedown',down);addEventListener('mousemove',move);addEventListener('mouseup',up);
document.getElementById('reset').onclick=()=>reset(true);addEventListener('resize',resize);
function loop(){physics();draw();requestAnimationFrame(loop)}resize();loop();
})();
</script></body></html>
