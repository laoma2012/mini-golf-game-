<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Mini Golf V22 · Hole 2</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9e7cf;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
#game{display:block;width:100vw;height:100vh;touch-action:none}
#hud{position:fixed;left:14px;right:14px;top:calc(10px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;pointer-events:none;color:#1f2b22;font-weight:700;text-shadow:0 1px 0 rgba(255,255,255,.8)}
#hud .pill{background:rgba(255,255,255,.78);backdrop-filter:blur(8px);padding:8px 12px;border-radius:999px;font-size:14px}
#reset{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:3;border:0;border-radius:999px;background:rgba(255,255,255,.86);padding:11px 15px;font-size:14px;font-weight:700;color:#283228;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#tip{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);pointer-events:none;background:rgba(24,34,26,.78);color:white;padding:8px 12px;border-radius:999px;font-size:13px;white-space:nowrap;transition:opacity .3s}
#result{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.15);z-index:4}
#result .card{background:white;border-radius:24px;padding:24px 28px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.2)}
#result h2{margin:0 0 6px;font-size:28px} #result p{margin:0;color:#555}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="pill">第 2 洞</div><div class="pill" id="strokeHud">杆数 0</div></div>
<button id="reset">重置</button>
<div id="tip">按住白球向后拖动，松手击球</div>
<div id="result"><div class="card"><h2 id="resultTitle">进洞</h2><p id="resultText"></p></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let AC=null,master=null,rollSrc=null,rollGain=null,rollFilter=null;
function audioInit(){
 if(AC)return;
 AC=new (window.AudioContext||window.webkitAudioContext)();
 master=AC.createGain();master.gain.value=.72;master.connect(AC.destination);
 const n=AC.sampleRate*2,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);
 for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
 rollSrc=AC.createBufferSource();rollSrc.buffer=b;rollSrc.loop=true;
 rollFilter=AC.createBiquadFilter();rollFilter.type='lowpass';rollFilter.frequency.value=520;rollFilter.Q.value=.35;
 rollGain=AC.createGain();rollGain.gain.value=0;
 rollSrc.connect(rollFilter).connect(rollGain).connect(master);rollSrc.start();
}
function tone(freq,dur,vol=.1,type='sine',endFreq=null){
 if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),gn=AC.createGain();
 o.type=type;o.frequency.setValueAtTime(freq,t);if(endFreq)o.frequency.exponentialRampToValueAtTime(endFreq,t+dur);
 gn.gain.setValueAtTime(Math.max(.0001,vol),t);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(gn).connect(master);o.start(t);o.stop(t+dur+.02);
}
function noiseHit(dur=.04,vol=.08,freq=1600){
 if(!AC)return;const n=Math.max(1,Math.floor(AC.sampleRate*dur)),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);
 for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
 const src=AC.createBufferSource(),flt=AC.createBiquadFilter(),gn=AC.createGain();
 src.buffer=b;flt.type='bandpass';flt.frequency.value=freq;flt.Q.value=.8;gn.gain.value=vol;
 src.connect(flt).connect(gn).connect(master);src.start();
}
function sfxStrike(v){
 audioInit();const q=Math.min(1,v/6);
 tone(1180+420*q,.014,.040+.095*q,'triangle',760+180*q);
 tone(330+80*q,.022,.018+.035*q,'sine',250);
 noiseHit(.009,.010+.025*q,2800+900*q);
}
function sfxWall(v){
 audioInit();const q=Math.min(1,v/6);
 tone(390+220*q,.045+.018*q,.07+.11*q,'triangle',250+120*q);
 noiseHit(.028,.035+.05*q,1800+700*q);
}
function updateRoll(){
 if(!AC||!rollGain)return;
 const s=Math.hypot(ball.vx,ball.vy),active=!ball.sunk&&s>.12;
 const target=active?Math.min(.012,.0012+Math.max(0,s-.12)*.002):0;
 rollGain.gain.setTargetAtTime(target,AC.currentTime,.055);
 rollFilter.frequency.setTargetAtTime(260+Math.min(420,s*70),AC.currentTime,.07);
}
const strokeHud=document.getElementById('strokeHud'),tip=document.getElementById('tip'),result=document.getElementById('result');
const resultTitle=document.getElementById('resultTitle'),resultText=document.getElementById('resultText');
let DPR=1,W=0,H=0,S=1,ox=0,oy=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
 const worldW=8.2,worldH=7.1; S=Math.min((W-24)/worldW,(H-74)/worldH); ox=(W-worldW*S)/2; oy=(H-worldH*S)/2+16;}
addEventListener('resize',resize);resize();

const tee={x:.75,y:.55}, hole={x:6.72,y:5.60,r:.075*2.53};
const wallAngle=47*Math.PI/180;
const wallPivot={x:0,y:5.0}, wallTopY=6.25;
const diagEnd={x:(wallTopY-wallPivot.y)/Math.tan(wallAngle),y:wallTopY};
const course=[
 {x:0,y:0},{x:1.5,y:0},{x:1.5,y:4.75},{x:7.55,y:4.75},
 {x:7.55,y:6.25},{x:diagEnd.x,y:6.25},{x:0,y:5.0}
];
const bunker={x:3.85,y:5.13,rx:.65,ry:.33};
const ball={x:tee.x,y:tee.y,vx:0,vy:0,r:.075,moving:false,sunk:false,z:0,vz:0,alpha:1,scale:1};
let strokes=0,dragging=false,dragPt=null,last=performance.now(),celebrate=0;
let cupMode='free',cupWasInside=false,cupPeakEntry=0,cupEntryFalling=0,fastCupTransit=false,fastCupCooldown=false,cupEscapeLock=false;

function P(p){return{x:ox+p.x*S,y:H-(oy+p.y*S)}}
function unP(x,y){return{x:(x-ox)/S,y:(H-y-oy)/S}}
function reset(showTip=true){Object.assign(ball,{x:tee.x,y:tee.y,vx:0,vy:0,moving:false,sunk:false,z:0,vz:0,alpha:1,scale:1});cupMode='free';cupWasInside=false;cupPeakEntry=0;cupEntryFalling=0;fastCupTransit=false;fastCupCooldown=false;cupEscapeLock=false;strokes=0;strokeHud.textContent='杆数 0';result.style.display='none';celebrate=0;if(showTip)tip.style.opacity='1';draw();}
document.getElementById('reset').onclick=()=>reset();

function distToSeg(px,py,a,b){
 const abx=b.x-a.x,aby=b.y-a.y,l2=abx*abx+aby*aby;
 let t=((px-a.x)*abx+(py-a.y)*aby)/l2;t=Math.max(0,Math.min(1,t));
 const x=a.x+t*abx,y=a.y+t*aby;return{x,y,t,d:Math.hypot(px-x,py-y)};
}
function collide(){
 for(let i=0;i<course.length;i++){
  const a=course[i],b=course[(i+1)%course.length],cp=distToSeg(ball.x,ball.y,a,b);
  if(cp.d<ball.r){
   const ex=b.x-a.x,ey=b.y-a.y,el=Math.hypot(ex,ey);
   let nx=-ey/el,ny=ex/el;
   if((ball.x-cp.x)*nx+(ball.y-cp.y)*ny<0){nx=-nx;ny=-ny}
   ball.x+=nx*(ball.r-cp.d+.001);ball.y+=ny*(ball.r-cp.d+.001);
   const vn=ball.vx*nx+ball.vy*ny;
   if(vn<0){
    const impactSpeed=Math.hypot(ball.vx,ball.vy);
    const isPrecisionWall=(i===5 || i===6); // diagonal/adjacent outer turn
    const e=isPrecisionWall?1.0:.86;
    ball.vx-=(1+e)*vn*nx;ball.vy-=(1+e)*vn*ny;sfxWall(impactSpeed);
   }
  }
 }
}
function inBunker(){const dx=(ball.x-bunker.x)/bunker.rx,dy=(ball.y-bunker.y)/bunker.ry;return dx*dx+dy*dy<=1}
function finishSink(){
 if(ball.sunk)return;
 ball.sunk=true;ball.moving=false;celebrate=1;
 setTimeout(()=>{resultTitle.textContent=strokes===1?'一杆进洞！':'进洞！';resultText.textContent='第 '+strokes+' 杆完成';result.style.display='flex'},380);
}
function beginDrop(){
 if(cupMode==='drop')return;
 cupMode='drop';ball.z=0;ball.vz=.55;
}
function dropPhysics(dt){
 // V21-style visual drop: retain a little horizontal momentum, then shrink/fade.
 ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
 ball.vx*=Math.pow(.90,dt*60);ball.vy*=Math.pow(.90,dt*60);
 ball.vz+=.34*dt*60;ball.z+=ball.vz*dt*60;
 const t=Math.min(1,ball.z/(ball.r*2.7));
 ball.scale=1-.38*t;ball.alpha=1-.72*t;
 if(t>=1){finishSink();return true}
 return false;
}
function cupPhysics(dt){
 if(cupMode==='drop')return dropPhysics(dt);

 const rx=ball.x-hole.x,ry=ball.y-hole.y;
 const d=Math.hypot(rx,ry)||.000001;
 const s=Math.hypot(ball.vx,ball.vy);
 const contact=hole.r+ball.r;
 const overlap=contact-d;

 if(fastCupCooldown){
   if(d>contact+ball.r*2.05){
     fastCupCooldown=false;fastCupTransit=false;cupEscapeLock=false;
     cupWasInside=false;cupPeakEntry=0;cupEntryFalling=0;cupMode='free';
   }else return false;
 }
 if(cupEscapeLock){
   if(d>contact+ball.r*2.05){
     cupEscapeLock=false;cupWasInside=false;cupPeakEntry=0;cupEntryFalling=0;cupMode='free';
   }else return false;
 }
 if(overlap<=0){
   if(fastCupTransit){fastCupTransit=false;fastCupCooldown=true}
   else {cupWasInside=false;cupPeakEntry=0;cupEntryFalling=0}
   return false;
 }
 if(s<.0001)return false;

 const entry=Math.max(0,Math.min(1,overlap/(2*ball.r)));
 const ux=rx/d,uy=ry/d;
 const radial=ball.vx*ux+ball.vy*uy;
 const tangential=-ball.vx*uy+ball.vy*ux;
 const lineOffset=Math.abs(rx*ball.vy-ry*ball.vx)/Math.max(s,.0001);
 const central=lineOffset<ball.r*.27;

 // Thresholds scaled for Hole 2's meter/second physics.
 if(!fastCupTransit && entry>.08 && s>3.55)fastCupTransit=true;
 if(entry>.28)cupWasInside=true;
 if(entry>cupPeakEntry+.008){cupPeakEntry=entry;cupEntryFalling=0}
 else if(cupPeakEntry>.42 && entry<cupPeakEntry-.035){cupEntryFalling++}

 if(fastCupTransit && central){
   const loss=.989-.024*entry;
   ball.vx*=loss;ball.vy*=loss;
   return false;
 }

 let nr=radial,nt=tangential;
 if(nr>0)nr*=Math.max(.18,.96-.70*entry);
 else nr*=Math.max(.55,.995-.20*entry);
 nt*=Math.max(.86,.998-.055*entry);
 const inward=.010+.075*entry*entry;
 nr-=inward*(.55+Math.min(1,2.0/Math.max(s,.2))*.45);
 ball.vx=nr*ux-nt*uy;ball.vy=nr*uy+nt*ux;

 const v2=Math.hypot(ball.vx,ball.vy);
 const outwardNow=ball.vx*ux+ball.vy*uy;

 if(fastCupTransit && cupWasInside && cupPeakEntry>.38 && cupEntryFalling>=1 && outwardNow>.02){
   fastCupTransit=false;fastCupCooldown=true;cupMode='free';return false;
 }
 if(fastCupTransit)return false;

 const clearlyEscaping=cupWasInside&&cupPeakEntry>.48&&cupEntryFalling>=1&&outwardNow>.035;
 if(clearlyEscaping&&(v2>1.70||Math.abs(nt)>1.45)){
   cupEscapeLock=true;cupMode='free';return false;
 }

 const offsetRatio=Math.min(1,lineOffset/(hole.r||1));
 const captureDepth=.60+.18*offsetRatio;
 const captureSpeed=3.15-1.45*offsetRatio;

 // Deep + slow must drop; ~75% body entry strongly commits unless clearly escaping.
 if(cupEntryFalling===0 && entry>=captureDepth && v2<=captureSpeed){beginDrop();return dropPhysics(dt)}
 if(cupEntryFalling===0 && entry>=.75 && v2<=3.45){beginDrop();return dropPhysics(dt)}
 if(v2<.08 && entry>.45){beginDrop();return dropPhysics(dt)}
 return false;
}
function step(dt){
 if(ball.sunk)return;
 if(cupMode==='drop'){dropPhysics(dt);return}
 if(!ball.moving)return;

 ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;collide();
 if(cupPhysics(dt))return;

 let sp=Math.hypot(ball.vx,ball.vy);
 const dec=inBunker()?1.55:.30;
 if(sp>0){
   const ns=Math.max(0,sp-dec*dt);
   ball.vx*=ns/sp;ball.vy*=ns/sp;sp=ns;
 }
 if(cupPhysics(dt))return;
 if(sp<.025){ball.vx=ball.vy=0;ball.moving=false}
}
function pointer(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{
 audioInit();if(AC&&AC.state==='suspended')AC.resume();
 if(ball.moving||ball.sunk)return;const m=pointer(e),bp=P(ball);
 if(Math.hypot(m.x-bp.x,m.y-bp.y)<34){dragging=true;dragPt=m;canvas.setPointerCapture(e.pointerId);tip.style.opacity='0'}
});
canvas.addEventListener('pointermove',e=>{if(dragging){dragPt=pointer(e);draw()}});
canvas.addEventListener('pointerup',e=>{
 if(!dragging)return;dragging=false;const m=pointer(e),bp=P(ball),dx=bp.x-m.x,dy=bp.y-m.y;
 const len=Math.hypot(dx,dy);if(len<8){dragPt=null;draw();return}
 const max=145,p=Math.min(len,max)/max,spd=1.0+p*4.9;
 const wx=dx/len,wy=-dy/len;
 let power=inBunker()?.68:1;
 cupMode='free';cupWasInside=false;cupPeakEntry=0;cupEntryFalling=0;fastCupTransit=false;fastCupCooldown=false;cupEscapeLock=false;ball.vx=wx*spd*power;ball.vy=wy*spd*power;sfxStrike(Math.hypot(ball.vx,ball.vy));ball.moving=true;strokes++;strokeHud.textContent='杆数 '+strokes;dragPt=null;
});
canvas.addEventListener('pointercancel',()=>{dragging=false;dragPt=null});

function drawCourse(){
 ctx.fillStyle='#d8e6ce';ctx.fillRect(0,0,W,H);
 // decorative islands/trees
 for(const [x,y,r] of [[.2,6.6,.22],[7.8,6.7,.28],[7.7,1.0,.25],[2.35,1.2,.18],[2.1,6.65,.16]]){
  const p=P({x,y});ctx.beginPath();ctx.arc(p.x,p.y,r*S,0,Math.PI*2);ctx.fillStyle='#8fbf79';ctx.fill();
 }
 ctx.beginPath();course.forEach((p,i)=>{const q=P(p);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.closePath();
 ctx.fillStyle='#79bb69';ctx.fill();ctx.lineWidth=6;ctx.strokeStyle='#6f5a3d';ctx.stroke();
 // bunker
 const b=P(bunker);ctx.save();ctx.translate(b.x,b.y);ctx.scale(1,.52);ctx.beginPath();ctx.arc(0,0,bunker.rx*S,0,Math.PI*2);ctx.fillStyle='#e8d39d';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#cfb97d';ctx.stroke();ctx.restore();
 // flag/hole
 const hp=P(hole);ctx.beginPath();ctx.arc(hp.x,hp.y,hole.r*S,0,Math.PI*2);ctx.fillStyle='#182018';ctx.fill();
 ctx.beginPath();ctx.moveTo(hp.x,hp.y);ctx.lineTo(hp.x,hp.y-50);ctx.strokeStyle='#f4f2e8';ctx.lineWidth=3;ctx.stroke();
 ctx.beginPath();ctx.moveTo(hp.x,hp.y-50);ctx.lineTo(hp.x+25,hp.y-41);ctx.lineTo(hp.x,hp.y-32);ctx.closePath();ctx.fillStyle='#d95f4f';ctx.fill();
}
function drawAim(){
 if(!dragging||!dragPt)return;const bp=P(ball),dx=bp.x-dragPt.x,dy=bp.y-dragPt.y,len=Math.hypot(dx,dy)||1,max=145,k=Math.min(len,max)/len;
 const tx=bp.x+dx*k,ty=bp.y+dy*k;
 ctx.save();ctx.setLineDash([8,7]);ctx.strokeStyle='rgba(255,255,255,.92)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(bp.x,bp.y);ctx.lineTo(tx,ty);ctx.stroke();ctx.setLineDash([]);
 ctx.beginPath();ctx.arc(dragPt.x,dragPt.y,18,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;ctx.stroke();ctx.restore();
}
function drawBall(){
 if(ball.sunk)return;const p=P(ball);ctx.save();ctx.globalAlpha=ball.alpha;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(2,ball.r*S*ball.scale),0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=1.4;ctx.strokeStyle='#777';ctx.stroke();ctx.restore();
}
function draw(){drawCourse();drawAim();drawBall()}
function loop(now){const dt=Math.min(.02,(now-last)/1000);last=now;for(let i=0;i<2;i++)step(dt/2);updateRoll();draw();requestAnimationFrame(loop)}
reset();requestAnimationFrame(loop);
</script>
</body>
</html>
